# Déploiement de l'API sur Render (Blueprint) — voir docs/06_deploiement.md
services:
  - type: web
    name: portefeuille-500k-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.18"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # ex. https://portefeuille-500k.vercel.app
      # Essai de seuils resserrés (D-10). Supprimer ces deux lignes = retour à la SPEC (60 / 40).
      - key: SEUIL_ACHAT
        value: "55"
      - key: SEUIL_VENTE
        value: "45"
